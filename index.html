<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PixelPro — Framing Excellence</title>
  <meta name="description" content="PixelPro — Professional photography, photo retouching, graphic design and video editing. Framing Excellence.">

  <style>
    :root {
      --black: #050505;
      --black-soft: #0b0b0b;
      --white: #ffffff;
      --muted: #a6a6a6;
      --line: rgba(255,255,255,0.09);
      --red: #ff2028;
      --max: 1180px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(92%, var(--max));
      margin: auto;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(5,5,5,0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand-full {
      width: 150px;
    }

    .brand-full img {
      width: 100%;
      height: auto;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      color: #ddd;
      font-size: 14px;
      transition: .25s ease;
    }

    .nav-links a:hover {
      color: var(--red);
    }

    .nav-cta {
      background: var(--red);
      padding: 11px 18px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 13px;
      transition: .25s ease;
    }

    .nav-cta:hover {
      background: #fff;
      color: #000;
      transform: translateY(-2px);
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 100vh;
      padding-top: 78px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 85% 50%, rgba(255,32,40,.18), transparent 35%),
        linear-gradient(110deg, #050505 45%, #0b0b0b 100%);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      right: -200px;
      bottom: -200px;
      background: rgba(255,32,40,.12);
      filter: blur(100px);
      border-radius: 50%;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 720px;
      padding: 80px 0;
    }

    .hero-logo {
      width: min(390px, 75vw);
      margin-bottom: 22px;
    }

    .tagline {
      color: #fff;
      letter-spacing: 8px;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 78px);
      line-height: .98;
      letter-spacing: -3px;
      max-width: 850px;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: var(--red);
    }

    .hero p {
      color: var(--muted);
      max-width: 650px;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 23px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 14px;
      transition: .25s ease;
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
    }

    .btn-primary:hover {
      background: #fff;
      color: #000;
      transform: translateY(-3px);
    }

    .btn-outline {
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
    }

    .btn-outline:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* =========================
       SECTIONS
    ========================== */

    section {
      padding: 110px 0;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 55px;
    }

    .section-mark {
      width: 42px;
      margin: 0 auto 18px;
    }

    .section-heading h2 {
      font-size: clamp(32px, 5vw, 50px);
      letter-spacing: -1.5px;
      margin-bottom: 12px;
    }

    .section-heading p {
      color: var(--muted);
      max-width: 600px;
      margin: auto;
    }

    /* =========================
       ABOUT
    ========================== */

    .about {
      background: var(--black-soft);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .p-logo-box {
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle, rgba(255,32,40,.14), transparent 65%),
        #080808;
      border-radius: 20px;
      margin-bottom: 30px;
    }

    .p-logo-box img {
      width: 125px;
      height: auto;
    }

    .about h2 {
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.05;
      margin-bottom: 22px;
    }

    .about h2 span {
      color: var(--red);
    }

    .about p {
      color: var(--muted);
      margin-bottom: 18px;
    }

    .about-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 35px;
    }

    .stat {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #080808;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-bottom: 4px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       SERVICES
    ========================== */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .service-card {
      padding: 32px 24px;
      background: linear-gradient(145deg, #111, #090909);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: .3s ease;
    }

    .service-card:hover {
      transform: translateY(-7px);
      border-color: rgba(255,32,40,.6);
    }

    .service-number {
      color: var(--red);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 35px;
    }

    .service-card h3 {
      font-size: 21px;
      margin-bottom: 12px;
    }

    .service-card p {
      color: var(--muted);
      font-size: 14px;
    }
