<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PixelPro — Framing Excellence</title>
  <meta name="description" content="PixelPro — Professional photography, photo retouching, graphic design and video editing. Framing Excellence.">

  <style>
    :root {
      --black: #050505;
      --black-soft: #0a0a0a;
      --card: #111111;
      --white: #ffffff;
      --muted: #a6a6a6;
      --line: rgba(255,255,255,.09);
      --red: #ff2028;
      --red-dark: #b90008;
      --max: 1180px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(92%, var(--max));
      margin: auto;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand-full {
      width: 150px;
      flex-shrink: 0;
    }

    .brand-full img {
      width: 100%;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      color: #ddd;
      font-size: 14px;
      transition: .25s ease;
    }

    .nav-links a:hover {
      color: var(--red);
    }

    .nav-cta {
      background: var(--red);
      padding: 11px 18px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 13px;
      transition: .25s ease;
      white-space: nowrap;
    }

    .nav-cta:hover {
      background: #fff;
      color: #000;
      transform: translateY(-2px);
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 100vh;
      padding-top: 78px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 85% 50%, rgba(255,32,40,.18), transparent 35%),
        linear-gradient(110deg, #050505 45%, #0b0b0b 100%);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      right: -200px;
      bottom: -200px;
      background: rgba(255,32,40,.12);
      filter: blur(100px);
      border-radius: 50%;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 720px;
      padding: 80px 0;
    }

    .hero-logo {
      width: min(390px, 75vw);
      margin-bottom: 22px;
    }

    .tagline {
      color: #fff;
      letter-spacing: 8px;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 78px);
      line-height: .98;
      letter-spacing: -3px;
      max-width: 850px;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: var(--red);
    }

    .hero p {
      color: var(--muted);
      max-width: 650px;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 23px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 14px;
      transition: .25s ease;
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
    }

    .btn-primary:hover {
      background: #fff;
      color: #000;
      transform: translateY(-3px);
    }

    .btn-outline {
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
    }

    .btn-outline:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* =========================
       SECTIONS
    ========================== */

    section {
      padding: 110px 0;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 55px;
    }

    .section-mark {
      width: 42px;
      margin: 0 auto 18px;
    }

    .section-heading h2 {
      font-size: clamp(32px, 5vw, 50px);
      letter-spacing: -1.5px;
      margin-bottom: 12px;
    }

    .section-heading p {
      color: var(--muted);
      max-width: 600px;
      margin: auto;
    }

    /* =========================
       ABOUT
    ========================== */

    .about {
      background: var(--black-soft);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .p-logo-box {
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle, rgba(255,32,40,.14), transparent 65%),
        #080808;
      border-radius: 20px;
    }

    .p-logo-box img {
      width: 125px;
    }

    .about h2 {
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.05;
      margin-bottom: 22px;
    }

    .about h2 span {
      color: var(--red);
    }

    .about p {
      color: var(--muted);
      margin-bottom: 18px;
    }

    .about-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 35px;
    }

    .stat {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #080808;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-bottom: 4px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       SERVICES
    ========================== */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .service-card {
      padding: 32px 24px;
      background: linear-gradient(145deg, #111, #090909);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: .3s ease;
    }

    .service-card:hover {
      transform: translateY(-7px);
      border-color: rgba(255,32,40,.6);
    }

    .service-number {
      color: var(--red);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 35px;
    }

    .service-card h3 {
      font-size: 21px;
      margin-bottom: 12px;
    }

    .service-card p {
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       PREMIUM MY JOBS
       ASYMMETRIC PORTFOLIO
    ========================== */

    .portfolio {
      background:
        radial-gradient(circle at 15% 20%, rgba(255,32,40,.06), transparent 30%),
        var(--black-soft);
    }

    .portfolio-intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 45px;
    }

    .portfolio-intro-left {
      max-width: 650px;
    }

    .portfolio-kicker {
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .portfolio-intro h3 {
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1;
      letter-spacing: -2px;
    }

    .portfolio-intro p {
      color: var(--muted);
      max-width: 500px;
      margin-top: 15px;
    }

    .portfolio-count {
      color: #666;
      font-size: 12px;
      white-space: nowrap;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /*
      CSS GRID ART DIRECTION

      The gallery is intentionally NOT a normal
      equal 3-column gallery.

      Cards have different sizes and positions
      to create a premium editorial portfolio feel.
    */

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 105px;
      gap: 14px;
    }

    .portfolio-item {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
      border: 1px solid var(--line);
      min-height: 0;
      isolation: isolate;
    }

    .portfolio-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition:
        transform .7s cubic-bezier(.2,.7,.2,1),
        filter .5s ease;
    }

    .portfolio-item::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.9),
          rgba(0,0,0,.05) 65%
        );
      opacity: .7;
      transition: .4s ease;
    }

    .portfolio-item:hover img {
      transform: scale(1.08);
      filter: brightness(.8);
    }

    .portfolio-item:hover::after {
      opacity: 1;
    }

    .portfolio-overlay {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 25px;
      transform: translateY(8px);
      transition: .35s ease;
    }

    .portfolio-item:hover .portfolio-overlay {
      transform: translateY(0);
    }

    .portfolio-overlay .number {
      display: block;
      color: var(--red);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .portfolio-overlay strong {
      display: block;
      font-size: 16px;
      line-height: 1.2;
    }

    .portfolio-overlay span {
      display: block;
      color: #bbb;
      font-size: 11px;
      margin-top: 3px;
    }

    /* Featured layouts */

    .job-1 {
      grid-column: span 7;
      grid-row: span 5;
    }

    .job-2 {
      grid-column: span 5;
      grid-row: span 3;
    }

    .job-3 {
      grid-column: span 5;
      grid-row: span 2;
    }

    .job-4 {
      grid-column: span 4;
      grid-row: span 4;
    }

    .job-5 {
      grid-column: span 4;
      grid-row: span 4;
    }

    .job-6 {
      grid-column: span 4;
      grid-row: span 4;
    }

    .job-7 {
      grid-column: span 6;
      grid-row: span 4;
    }

    .job-8 {
      grid-column: span 6;
      grid-row: span 4;
    }

    .job-9 {
      grid-column: span 4;
      grid-row: span 5;
    }

    .job-10 {
      grid-column: span 8;
      grid-row: span 5;
    }

    .job-11,
    .job-12,
    .job-13,
    .job-14,
    .job-15,
    .job-16 {
      grid-column: span 4;
      grid-row: span 4;
    }

    .job-17 {
      grid-column: span 8;
      grid-row: span 5;
    }

    .job-18 {
      grid-column: span 4;
      grid-row: span 5;
    }

    .job-19,
    .job-20,
    .job-21,
    .job-22 {
      grid-column: span 3;
      grid-row: span 4;
    }

    .job-23 {
      grid-column: span 6;
      grid-row: span 5;
    }

    .job-24 {
      grid-column: span 6;
      grid-row: span 5;
    }

    .job-25,
    .job-26,
    .job-27,
    .job-28 {
      grid-column: span 4;
      grid-row: span 4;
    }

    .job-29 {
      grid-column: span 5;
      grid-row: span 5;
    }

    .job-30 {
      grid-column: span 7;
      grid-row: span 5;
    }

    .job-31,
    .job-32,
    .job-33 {
      grid-column: span 4;
      grid-row: span 4;
    }

    .job-34 {
      grid-column: span 8;
      grid-row: span 5;
    }

    .job-35 {
      grid-column: span 4;
      grid-row: span 5;
    }

    .job-36,
    .job-37,
    .job-38,
    .job-39 {
      grid-column: span 3;
      grid-row: span 4;
    }

    .job-40 {
      grid-column: span 6;
      grid-row: span 5;
    }

    .job-41 {
      grid-column: span 6;
      grid-row: span 5;
    }

    .job-42,
    .job-43,
    .job-44 {
      grid-column: span 4;
      grid-row: span 4;
    }

    .job-45 {
      grid-column: span 8;
      grid-row: span 5;
    }

    .job-46 {
      grid-column: span 4;
      grid-row: span 5;
    }

    .job-47,
    .job-48,
    .job-49 {
      grid-column: span 4;
      grid-row: span 4;
    }

    .job-50 {
      grid-column: span 6;
      grid-row: span 5;
    }

    .job-51 {
      grid-column: span 6;
      grid-row: span 5;
    }

    /* =========================
       CTA
    ========================== */

    .cta {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(100deg, #080808, #170000, #080808);
      border-top: 1px solid rgba(255,32,40,.2);
      border-bottom: 1px solid rgba(255,32,40,.2);
    }

    .cta-grid {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 35px;
    }

    .cta-logo {
      width: 85px;
    }

    .cta h2 {
      font-size: clamp(28px, 4vw, 45px);
      line-height: 1.05;
      margin-bottom: 8px;
    }

    .cta p {
      color: var(--muted);
    }

    /* =========================
       CONTACT
    ========================== */

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
    }

    .contact h2 {
      font-size: clamp(35px, 5vw, 55px);
      line-height: 1;
      margin-bottom: 20px;
    }

    .contact h2 span {
      color: var(--red);
    }

    .contact-intro {
      color: var(--muted);
      max-width: 500px;
    }

    .contact-list {
      display: grid;
      gap: 14px;
    }

    .contact-item {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #090909;
      transition: .25s ease;
    }

    .contact-item:hover {
      border-color: var(--red);
      transform: translateX(4px);
    }

    .contact-item small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .contact-item strong {
      font-size: 16px;
    }

    .contact-buttons {
      display: flex;
      gap: 14px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .contact-icon {
      min-width: 125px;
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #090909;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: .25s ease;
    }

    .contact-icon:hover {
      border-color: var(--red);
      transform: translateY(-3px);
    }

    .contact-icon .icon {
      font-size: 22px;
      line-height: 1;
    }

    .contact-icon small {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      padding: 50px 0 25px;
      background: #030303;
      border-top: 1px solid var(--line);
    }

    .footer-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 30px;
      padding-bottom: 40px;
    }

    .footer-logo {
      width: 145px;
    }

    .socials {
      display: flex;
      gap: 18px;
      justify-content: center;
    }

    .socials a {
      color: #aaa;
      font-size: 13px;
      transition: .2s;
    }

    .socials a:hover {
      color: var(--red);
    }

    .footer-contact {
      text-align: right;
      color: #aaa;
      font-size: 13px;
    }

    .footer-bottom {
      padding-top: 22px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #666;
      font-size: 11px;
    }

    /* =========================
       TABLET
    ========================== */

    @media (max-width: 900px) {

      .nav-links {
        display: none;
      }

      .nav {
        min-height: 68px;
      }

      .brand-full {
        width: 125px;
      }

      .hero {
        min-height: auto;
      }

      .hero-content {
        padding: 90px 0 100px;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .about-grid,
      .contact-grid {
        grid-template-columns: 1fr;
      }

      .services-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .portfolio-grid {
        grid-template-columns: repeat(6, 1fr);
        grid-auto-rows: 100px;
      }

      .portfolio-item {
        grid-column: span 3 !important;
        grid-row: span 4 !important;
      }

      .portfolio-item:nth-child(1),
      .portfolio-item:nth-child(10),
      .portfolio-item:nth-child(17),
      .portfolio-item:nth-child(23),
      .portfolio-item:nth-child(30),
      .portfolio-item:nth-child(34),
      .portfolio-item:nth-child(40),
      .portfolio-item:nth-child(45),
      .portfolio-item:nth-child(50) {
        grid-column: span 6 !important;
        grid-row: span 5 !important;
      }

      .cta-grid {
        grid-template-columns: auto 1fr;
      }

      .cta-grid .btn {
        grid-column: 1 / -1;
        width: fit-content;
      }

      .footer-top {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .footer-logo {
        margin: auto;
      }

      .footer-contact {
        text-align: center;
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 560px) {

      section {
        padding: 80px 0;
      }

      .hero-logo {
        width: 280px;
      }

      .tagline {
        letter-spacing: 5px;
        font-size: 9px;
      }

      .hero p {
        font-size: 15px;
      }

      .buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .services-grid {
        grid-template-columns: 1fr;
      }

      .about-stats {
        grid-template-columns: 1fr;
      }

      .p-logo-box {
        width: 145px;
        height: 145px;
      }

      .p-logo-box img {
        width: 95px;
      }

      /* Premium mobile portfolio */

      .portfolio-intro {
        display: block;
      }

      .portfolio-count {
        display: block;
        margin-top: 18px;
      }

      .portfolio-grid {
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: 170px;
        gap: 10px;
      }

      .portfolio-item,
      .portfolio-item:nth-child(n) {
        grid-column: span 1 !important;
        grid-row: span 1 !important;
      }

      .portfolio-item:nth-child(1),
      .portfolio-item:nth-child(10),
      .portfolio-item:nth-child(17),
      .portfolio-item:nth-child(23),
      .portfolio-item:nth-child(30),
      .portfolio-item:nth-child(34),
      .portfolio-item:nth-child(40),
      .portfolio-item:nth-child(45),
      .portfolio-item:nth-child(50) {
        grid-column: span 2 !important;
        grid-row: span 2 !important;
      }

      .portfolio-overlay {
        padding: 15px;
      }

      .portfolio-overlay strong {
        font-size: 13px;
      }

      .portfolio-overlay span {
        font-size: 10px;
      }

      .cta-grid {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .cta-logo {
        margin: auto;
      }

      .cta-grid .btn {
        width: 100%;
      }

      .contact-buttons {
        flex-direction: column;
      }

      .contact-icon {
        width: 100%;
      }

      .footer-bottom {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>
    <div class="container nav">

      <a href="#home" class="brand-full">
        <img src="pixelpro-logo.png" alt="PixelPro">
      </a>

      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a
